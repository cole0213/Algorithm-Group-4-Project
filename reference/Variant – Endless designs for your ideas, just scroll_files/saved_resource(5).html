    <script vid="45">
        
        const calendar = document.getElementById('calendar');
        for (let i = 1; i <= 30; i++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            if (i < 14) cell.classList.add('completed');
            if (i === 14) cell.classList.add('active');
            
            const num = document.createElement('span');
            num.className = 'day-num';
            num.innerText = i;
            cell.appendChild(num);

            if (i < 14) {
                cell.innerHTML += `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            } else if (i === 14) {
                cell.innerHTML += `<div style="width:8px; height:8px; background:#1a237e; border-radius:50%;"></div>`;
            }

            calendar.appendChild(cell);
        }

        
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        
        const bubbleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                colorA: { value: new THREE.Color(0xffffff) },
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vViewPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vViewPosition = -mvPosition.xyz;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                varying vec3 vViewPosition;
                uniform float time;
                void main() {
                    vec3 normal = normalize(vNormal);
                    vec3 viewDir = normalize(vViewPosition);
                    float fresnel = pow(1.0 - dot(normal, viewDir), 3.0);
                    
                    // Iridescent fringe effect
                    float r = pow(1.0 - dot(normal, viewDir), 2.0 + sin(time * 0.5) * 0.5);
                    float g = pow(1.0 - dot(normal, viewDir), 2.5 + cos(time * 0.5) * 0.5);
                    float b = pow(1.0 - dot(normal, viewDir), 3.0 + sin(time * 0.8) * 0.5);
                    
                    vec3 rainbow = vec3(r, g, b) * 0.5;
                    vec3 finalColor = mix(vec3(1.0), rainbow, fresnel);
                    
                    gl_FragColor = vec4(finalColor, fresnel * 0.6);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        const bubbles = [];
        const bubbleCount = 8;
        const geometry = new THREE.IcosahedronGeometry(1, 15);

        for (let i = 0; i < bubbleCount; i++) {
            const bubble = new THREE.Mesh(geometry, bubbleMaterial.clone());
            bubble.position.set(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 5
            );
            const scale = Math.random() * 2 + 0.5;
            bubble.scale.set(scale, scale, scale);
            bubble.userData = {
                speed: Math.random() * 0.005 + 0.002,
                offset: Math.random() * Math.PI * 2
            };
            scene.add(bubble);
            bubbles.push(bubble);
        }

        camera.position.z = 8;

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            
            bubbles.forEach(b => {
                b.position.y += Math.sin(time + b.userData.offset) * 0.005;
                b.position.x += Math.cos(time + b.userData.offset) * 0.002;
                b.rotation.x += 0.001;
                b.rotation.y += 0.001;
                b.material.uniforms.time.value = time;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
